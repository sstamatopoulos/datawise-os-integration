# datawise-os-integration - secured full stack.
#
#   caddy                 the only service on the host network: TLS + access control
#   orion-ld + mongo      FIWARE NGSI-LD context broker (registry, latest state)
#   influxdb              time series
#   airflow (LocalExecutor) + postgres   runs the gates
#
# Security model (details in SECURITY.md):
#   * nothing but Caddy publishes a port; every backend is reachable only on
#     the internal network, and Caddy is what exposes it, over TLS;
#   * the broker is reachable from outside only with X-API-Key: ORION_API_KEY;
#   * InfluxDB requires its token, Airflow its login, MongoDB and Postgres
#     their passwords - all generated by scripts/gen-secrets.sh into .env;
#   * Caddy gets certificates from Let's Encrypt for a real PUBLIC_HOST and
#     issues its own for localhost.
#
#   ./scripts/gen-secrets.sh        # writes .env with random secrets
#   docker compose up -d --build
#   https://localhost              Airflow      https://orion.localhost   broker
#   https://influx.localhost       InfluxDB
#
# For an unproxied developer box, add -f docker-compose.dev.yml (publishes
# backends on 127.0.0.1 without TLS). Never do that on a server.
x-logging: &default-logging
  driver: json-file
  options: {max-size: "20m", max-file: "3"}

x-airflow-common: &airflow-common
  build: .
  image: datagates-airflow:3.0.6
  logging: *default-logging
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?run scripts/gen-secrets.sh}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run scripts/gen-secrets.sh}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run scripts/gen-secrets.sh}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: https://${PUBLIC_HOST:-localhost}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 30s, not the 300s default: this is how long an edit to config/gates.yaml
    # takes to become DAGs. Five minutes of "did it work?" per change is how a
    # configurable platform stops feeling configurable, and it made the first
    # run of this stack look broken when it was merely slow.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "${DAG_REFRESH_INTERVAL:-30}"
    AIRFLOW__LOGGING__LOGGING_LEVEL: ${AIRFLOW_LOG_LEVEL:-INFO}
    PYTHONPATH: /opt/airflow:/opt/airflow/plugins
    # the platform - internal addresses, never through the proxy
    ORION_URL: http://orion-ld:1026
    INFLUX_URL: http://influxdb:8086
    INFLUX_ORG: ${INFLUX_ORG:-datagates}
    INFLUX_TOKEN: ${INFLUX_TOKEN:?run scripts/gen-secrets.sh}
    INFLUX_DEFAULT_BUCKET: ${INFLUX_DEFAULT_BUCKET:-telemetry}
    DATAGATES_CONFIG: /opt/airflow/config/gates.yaml
    # gate secrets referenced as ${VAR} in config/gates.yaml - add yours here,
    # and to .env.example, when you enable a gate that needs one
    SNMP_COMMUNITY: ${SNMP_COMMUNITY:-}
    OPCUA_USER: ${OPCUA_USER:-}
    OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
    OBIX_USER: ${OBIX_USER:-}
    OBIX_PASSWORD: ${OBIX_PASSWORD:-}
    ZABBIX_TOKEN: ${ZABBIX_TOKEN:-}
    TB_USERNAME: ${TB_USERNAME:-}
    TB_PASSWORD: ${TB_PASSWORD:-}
    MESH_API_KEY: ${MESH_API_KEY:-}
    WS_USER: ${WS_USER:-}
    WS_PASSWORD: ${WS_PASSWORD:-}
    PORTAL_USER: ${PORTAL_USER:-}
    PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
    DH_USER: ${DH_USER:-}
    DH_PASSWORD: ${DH_PASSWORD:-}
    MQTT_USER: ${MQTT_USER:-}
    MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    DB_USER: ${DB_USER:-}
    DB_PASSWORD: ${DB_PASSWORD:-}
    LEGACY_INFLUX_USER: ${LEGACY_INFLUX_USER:-}
    LEGACY_INFLUX_PASSWORD: ${LEGACY_INFLUX_PASSWORD:-}
    LEGACY_INFLUX_TOKEN: ${LEGACY_INFLUX_TOKEN:-}
    CITY_BROKER_KEY: ${CITY_BROKER_KEY:-}
    ENTSOE_TOKEN: ${ENTSOE_TOKEN:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs
    - ./drop:/opt/airflow/drop
    - ./scripts:/opt/airflow/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks: [internal]
  depends_on:
    postgres: {condition: service_healthy}

services:
  caddy:
    image: caddy:2
    logging: *default-logging
    # 80 and 443 by default, because that is what TLS and Let's Encrypt's
    # HTTP and TLS-ALPN challenges need. Override on a machine that already
    # runs something on those ports (HTTP_PORT=8080 HTTPS_PORT=8443 in .env);
    # certificates then have to come from a DNS challenge or be provided.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      # Never empty: an empty `email` is a Caddyfile parse error (see the
      # comment in proxy/Caddyfile). Set ACME_EMAIL for a real PUBLIC_HOST.
      ACME_EMAIL: ${ACME_EMAIL:-acme-email-not-set@example.invalid}
      ORION_API_KEY: ${ORION_API_KEY:?run scripts/gen-secrets.sh}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    restart: unless-stopped

  postgres:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-secrets.sh}
      POSTGRES_DB: airflow
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airflow"], interval: 10s, retries: 5}
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    logging: *default-logging
    command: --auth --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-orion}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run scripts/gen-secrets.sh}
    volumes: [mongo-data:/data/db]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  orion-ld:
    image: fiware/orion-ld:1.5.1
    logging: *default-logging
    # No -dbAuthDb, and no -dbURI either. Orion-LD 1.5.1 opens two connections
    # to MongoDB, with two drivers that read the configuration differently, and
    # only one combination satisfies both:
    #   * `-dbAuthDb admin` is appended to the C driver's connection string as
    #     a bare query option, which the driver then rejects
    #     ('URI option "admin" contains no "=" sign') - the broker crash-loops;
    #   * `-dbURI ...` fixes the C driver but the legacy C++ pool ignores it and
    #     connects with no credentials at all - "unable connect to mongo after a
    #     number of retries", and the broker crash-loops again.
    # Omitting both leaves `mongodb://user:pass@mongo/`, whose authSource
    # defaults to admin, which is exactly where MONGO_INITDB_ROOT_USERNAME
    # creates the user. Both drivers are happy.
    # Note: Orion-LD logs this connection string, password included, whenever
    # it cannot connect. See SECURITY.md.
    command: -dbhost mongo -dbuser ${MONGO_USER:-orion} -dbpwd ${MONGO_PASSWORD:?run scripts/gen-secrets.sh} -logLevel WARN -forwarding
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:1026/version"], interval: 15s, retries: 5}
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    logging: *default-logging
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?run scripts/gen-secrets.sh}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-datagates}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_DEFAULT_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-43800h}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?run scripts/gen-secrets.sh}
    volumes: [influxdb-data:/var/lib/influxdb2, influxdb-config:/etc/influxdb2]
    networks: [internal]
    healthcheck: {test: ["CMD", "influx", "ping"], interval: 30s, retries: 5}
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"], interval: 30s, retries: 5, start_period: 60s}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"], interval: 30s, retries: 5, start_period: 60s}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config,drop}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,drop}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run scripts/gen-secrets.sh}
    user: "0:0"

networks:
  # Backends live here and nowhere else. Caddy is the only member that also
  # publishes ports on the host.
  internal:

volumes:
  postgres-data:
  mongo-data:
  influxdb-data:
  influxdb-config:
  caddy-data:
  caddy-config:
