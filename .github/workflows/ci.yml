name: ci
on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}"}
      # Deliberately without requirements-gates.txt: the gates must import
      # and build with no field-protocol driver installed, which is what
      # keeps one unused gate type from breaking the whole DAG bag.
      # tests/test_registry.py asserts it.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  packaging:
    # `pip install .` has to work: gates are developed outside this tree
    # against the datagates package (see docs/adding-a-gate.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install .
      - name: every built-in type resolves from the installed package
        run: |
          python - <<'PY'
          from datagates.gates.registry import BUILTIN_TYPES, resolve_type
          for name in BUILTIN_TYPES:
              resolve_type(name)
          print(len(BUILTIN_TYPES), "gate types importable from the installed package")
          assert len(BUILTIN_TYPES) >= 20
          PY

  gate-extras:
    # Every optional driver must install and import next to the platform's own
    # dependencies, or a deployment that enables that gate cannot build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-gates.txt
      - name: the drivers import
        run: |
          python - <<'PY'
          import asyncua, BAC0, openpyxl, paho.mqtt, paramiko, pymodbus, pysnmp, sqlalchemy
          print("gate drivers ok")
          PY
      # The image runs SQLAlchemy 2.0 since Airflow 3.3; Airflow 3.0 pinned
      # 1.4.54, and deployments still on it run the sql gate on 1.4. The gate
      # has to work on both, so its tests run against both rather than against
      # whichever pip chose.
      - name: the sql gate on SQLAlchemy 1.4 and 2.x
        run: |
          pip install -r requirements-dev.txt
          for version in "1.4.54" "2.0.*"; do
            pip install -q "SQLAlchemy==${version}"
            python -c "import sqlalchemy; print('testing against SQLAlchemy', sqlalchemy.__version__)"
            pytest tests/test_gates_stores.py -q -k sql
          done

  integration:
    # The stack, for real: build it, start it, ingest weather, and assert what
    # a consumer would check. This is the job that would have caught the seven
    # fixes the first manual run cost (ROADMAP.md §3) -- every one of them was
    # invisible to the unit suite and to the other jobs here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: generate secrets
        run: ./scripts/gen-secrets.sh
      - name: build and start the stack
        run: |
          docker compose build
          docker compose up -d
      - name: integration test
        run: ./scripts/integration_test.sh
      - name: what the services said, if it failed
        if: failure()
        continue-on-error: true          # diagnostics must not mask the real failure
        run: |
          docker compose ps
          for service in orion-ld influxdb caddy airflow-scheduler airflow-dag-processor airflow-init; do
            echo "::group::$service"
            # Orion-LD prints its Mongo connection string, password included,
            # whenever it cannot connect (ROADMAP.md §3). Masked, because CI
            # logs of a public repository are public.
            docker compose logs --tail 120 "$service" 2>&1 | sed -E 's#mongodb://[^ )]*#mongodb://***MASKED***#g'
            echo "::endgroup::"
          done
      - name: stop the stack
        if: always()
        # Tolerant on purpose: if the stack never came up, compose cannot even
        # interpolate .env, and a failing teardown would hide why.
        run: docker compose down -v || true

  dags-load:
    # The DAG factory needs Airflow. Every configured gate must build, the
    # disabled examples included: they are the documentation, so they are
    # kept working.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/plugins
      DATAGATES_CONFIG: ${{ github.workspace }}/config/gates.yaml
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      TB_USERNAME: u
      TB_PASSWORD: p
      INDOOR_AIR_API_KEY: k
      ENTSOE_TOKEN: t
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      # The Airflow the image runs, read from the Dockerfile's FROM line, so
      # this job cannot keep testing one release while the image ships another.
      - run: |
          AIRFLOW_VERSION="$(sed -nE 's#^FROM apache/airflow:([0-9.]+).*#\1#p' Dockerfile)"
          test -n "$AIRFLOW_VERSION"
          echo "Airflow ${AIRFLOW_VERSION} from the Dockerfile"
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "$CONSTRAINTS"
          pip install -r requirements.txt --constraint "$CONSTRAINTS"
      - name: the DAG bag of the enabled gates
        run: |
          python - <<'PY'
          # Parse dags/ the way the scheduler does, so an import error is
          # reported with its file and traceback instead of as an empty bag.
          #
          # Do not test this by importing the module and counting instances of
          # airflow.models.DAG: in Airflow 3 the @dag decorator produces an
          # airflow.sdk DAG, which is a different class, so every DAG is built
          # and none is recognised.
          from airflow.models.dagbag import DagBag

          # safe_mode left at its default, deliberately: it is the scheduler's
          # behaviour, and it only parses files containing both "dag" and
          # "airflow". Passing safe_mode=False here made this job pass while
          # the real dag-processor found zero files.
          #
          # Examples are kept out by AIRFLOW__CORE__LOAD_EXAMPLES in the job's
          # env: Airflow 3.3 removed DagBag's include_examples argument.
          bag = DagBag(dag_folder="dags")
          for path, message in bag.import_errors.items():
              print(f"::error file={path}::{message}")
          assert not bag.import_errors, "the DAG folder has import errors"

          expected = {
              "weather_forecast_init", "weather_forecast_run",
              "weather_observed_init", "weather_observed_run", "weather_observed_backfill",
              "prices_init", "prices_run", "prices_backfill",
          }
          print("\n".join(sorted(bag.dags)))
          missing, extra = expected - set(bag.dags), set(bag.dags) - expected
          assert not missing, f"the enabled gates did not build: {sorted(missing)}"
          assert not extra, f"unexpected DAGs in the bag: {sorted(extra)}"
          print(len(bag.dags), "DAGs from the three enabled gates")
          PY
      - name: the DAGs of every gate in the catalogue, enabled or not
        run: |
          python - <<'PY'
          from datagates.dags.factory import build_dags
          from datagates.gates.registry import load_gates
          total = 0
          for gate in load_gates(include_disabled=True):
              built = build_dags(gate)
              total += len(built)
              print("%-18s %-14s %s" % (gate.key, gate.type_name, " ".join(sorted(built))))
              # init and run always; backfill unless the upstream has no past.
              wanted = 2 if gate.backfill_mode == "none" else 3
              assert len(built) == wanted, f"{gate.key}: built {sorted(built)}, expected {wanted} DAGs"
          print(total, "DAGs built from the shipped catalogue")
          # dags/datagates_dags.py deliberately swallows a broken gate so that
          # one bad entry cannot empty the deployment's DAG bag. This step is
          # where a broken entry must be loud instead, because the catalogue is
          # documentation.
          PY
